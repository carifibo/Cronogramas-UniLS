<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<title>Cronograma Semipresencial 2026/2 — UniLS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1F3A5F;
  --navy-dark: #162C47;
  --navy-darker: #0F1F33;
  --teal: #0891B2;
  --teal-light: #06B6D4;
  --teal-pale: #ECFEFF;

  --sync: #3B82F6;
  --sync-dark: #1D4ED8;
  --sync-pale: #EFF6FF;

  --lab: #10B981;
  --lab-dark: #047857;
  --lab-pale: #ECFDF5;

  --av: #F59E0B;
  --av-dark: #B45309;
  --av-pale: #FFFBEB;

  --disc-1: #0891B2;
  --disc-1-dark: #065666;
  --disc-2: #7C3AED;
  --disc-2-dark: #5B21B6;

  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --border: #E2E8F0;
  --text: #1E293B;
  --text-muted: #64748B;
  --text-soft: #94A3B8;

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
  --shadow-xl: 0 25px 50px -12px rgba(15, 23, 42, 0.2);

  --radius: 14px;
  --radius-sm: 8px;
  --radius-lg: 22px;

  --bottom-nav-h: 64px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
*::-webkit-scrollbar { height: 8px; width: 8px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--text-soft); border-radius: 4px; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
  padding-bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom));
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* ========================================
   HEADER (mobile-first, compacto)
   ======================================== */
.header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-darker) 100%);
  color: white;
  padding: 18px 16px 16px;
  padding-top: calc(18px + env(safe-area-inset-top));
  position: relative;
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--teal) 0%, var(--teal-light) 100%);
}
.header::before {
  content: '';
  position: absolute;
  top: -100px; right: -100px;
  width: 280px; height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(8, 145, 178, 0.22) 0%, transparent 70%);
  pointer-events: none;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  z-index: 1;
}
.brand-mark {
  width: 40px; height: 40px;
  background: white;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -1px;
  flex-shrink: 0;
}
.brand-meta { flex: 1; min-width: 0; }
.brand-text {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #93C5FD;
}
.brand-name {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 600;
  line-height: 1;
  margin-top: 1px;
  letter-spacing: -0.3px;
}
.header-period {
  font-size: 11px;
  color: #BFDBFE;
  text-align: right;
  line-height: 1.3;
}
.header-period strong {
  font-family: 'Fraunces', serif;
  font-size: 13px;
  font-weight: 600;
  display: block;
  color: white;
}

.header-title {
  font-family: 'Fraunces', serif;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -1px;
  line-height: 1.1;
  margin-top: 14px;
  position: relative;
  z-index: 1;
}
.header-title em {
  font-style: italic;
  color: var(--teal-light);
  font-weight: 400;
}

/* ========================================
   STATS ROW (horizontal scroll no mobile)
   ======================================== */
.stats-row {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 0 14px 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.stats-row::-webkit-scrollbar { display: none; }
.stats-row-inner {
  display: flex;
  gap: 10px;
  padding-right: 16px;
}
.stat-pill {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  min-width: 110px;
  flex-shrink: 0;
  position: relative;
  transition: all 0.2s ease;
}
.stat-pill::before {
  content: '';
  position: absolute;
  top: 10px; bottom: 10px; left: 0;
  width: 3px;
  background: var(--accent, var(--teal));
  border-radius: 0 2px 2px 0;
}
.stat-pill .v {
  font-family: 'Fraunces', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--accent, var(--navy));
  line-height: 1;
  letter-spacing: -1px;
}
.stat-pill .l {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin-top: 6px;
}

/* ========================================
   ACTIVE FILTER BADGE (mostra o que está filtrado)
   ======================================== */
.active-filters {
  padding: 12px 16px 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.filter-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 6px 10px 6px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
.filter-badge .badge-label {
  color: var(--text-muted);
  font-weight: 500;
  font-size: 11px;
}
.filter-badge .badge-x {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.2s;
}
.filter-badge .badge-x:hover, .filter-badge .badge-x:active { background: var(--av); color: white; }
.filter-badge .badge-x svg { width: 10px; height: 10px; }

.filter-badge.month-jul .badge-dot { background: #D97706; }
.filter-badge.month-ago .badge-dot { background: #DC2626; }
.filter-badge.month-set .badge-dot { background: #16A34A; }
.filter-badge.course .badge-dot { background: var(--teal); }
.badge-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ========================================
   MAIN
   ======================================== */
.main {
  padding: 18px 16px 32px;
}

/* ========================================
   LEGEND (compacta no mobile)
   ======================================== */
.legend {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 18px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.legend-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.legend-items {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
}
.legend-dot {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: white;
  font-weight: 700;
  font-family: 'Fraunces', serif;
  font-size: 13px;
  flex-shrink: 0;
}
.legend-dot.s { background: var(--sync); }
.legend-dot.l { background: var(--lab); }
.legend-dot.av { background: var(--av); font-size: 11px; }
.legend-item strong { font-weight: 700; color: var(--text); }
.legend-item span { color: var(--text-muted); font-size: 12px; display: block; }

/* ========================================
   COURSE TITLE ROW
   ======================================== */
.course-title-row {
  margin-bottom: 18px;
}
.course-eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 6px;
}
.course-title {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 600;
  color: var(--navy);
  letter-spacing: -1.2px;
  line-height: 1;
}
.course-title-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 8px;
}

/* ========================================
   OVERVIEW CARDS (mobile)
   ======================================== */
.overview-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.overview-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
}
.overview-card:active { transform: scale(0.98); }
.overview-card-num {
  font-family: 'Fraunces', serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--teal);
  width: 44px;
  text-align: center;
  flex-shrink: 0;
  line-height: 1;
}
.overview-card-body { flex: 1; min-width: 0; }
.overview-card-name {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--navy);
  letter-spacing: -0.5px;
  line-height: 1.1;
  margin-bottom: 6px;
}
.overview-card-stats {
  display: flex;
  gap: 10px;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  flex-wrap: wrap;
}
.overview-card-stats span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.overview-card-stats span::before {
  content: '';
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
}
.overview-card-stats .s-sync::before { background: var(--sync); }
.overview-card-stats .s-lab::before { background: var(--lab); }
.overview-card-stats .s-av::before { background: var(--av); }
.overview-card-arrow {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--bg);
  color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.overview-card:hover .overview-card-arrow,
.overview-card:active .overview-card-arrow {
  background: var(--teal);
  color: white;
  transform: translateX(2px);
}

/* ========================================
   DISCIPLINE CARDS (detalhe)
   ======================================== */
.disc-grid {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.disc-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
}
.disc-header {
  background: linear-gradient(135deg, var(--disc-color) 0%, var(--disc-color-dark) 100%);
  color: white;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.disc-num {
  background: white;
  color: var(--disc-color);
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 700;
  flex-shrink: 0;
}
.disc-meta { flex: 1; min-width: 0; }
.disc-eyebrow {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: 0.8;
}
.disc-name {
  font-family: 'Fraunces', serif;
  font-size: 17px;
  font-weight: 600;
  line-height: 1.2;
  margin-top: 3px;
  letter-spacing: -0.3px;
}
.disc-name em { font-style: italic; opacity: 0.85; font-weight: 400; }

.modality-list {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.modality {
  display: flex;
  gap: 12px;
  padding: 14px;
  border-radius: var(--radius);
  background: var(--mod-pale);
  border-left: 4px solid var(--mod-color);
}
.modality.mod-sync { --mod-color: var(--sync); --mod-dark: var(--sync-dark); --mod-pale: var(--sync-pale); }
.modality.mod-lab { --mod-color: var(--lab); --mod-dark: var(--lab-dark); --mod-pale: var(--lab-pale); }
.modality.mod-av { --mod-color: var(--av); --mod-dark: var(--av-dark); --mod-pale: var(--av-pale); }

.mod-icon-wrap {
  width: 40px; height: 40px;
  background: var(--mod-color);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: white;
  flex-shrink: 0;
}
.mod-icon-wrap svg { width: 20px; height: 20px; }
.mod-body { flex: 1; min-width: 0; }
.mod-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--mod-dark);
  margin-bottom: 2px;
}
.mod-main {
  font-family: 'Fraunces', serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--navy);
  letter-spacing: -0.3px;
  margin-bottom: 4px;
  line-height: 1.2;
}
.mod-sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.event-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}
.event-pill {
  background: white;
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  transition: all 0.15s ease;
  cursor: pointer;
  min-height: 32px;
}
.event-pill:active {
  border-color: var(--mod-color);
  background: var(--mod-pale);
  transform: scale(0.96);
}
.event-pill::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--mod-color);
  flex-shrink: 0;
}
.event-pill .cal-icon {
  width: 12px; height: 12px;
  opacity: 0.4;
  margin-left: 2px;
}
.event-pill:active .cal-icon { opacity: 1; color: var(--mod-dark); }
.event-pill .pill-wd {
  opacity: 0.65;
  font-weight: 500;
}

.no-events {
  font-size: 13px;
  color: var(--text-soft);
  font-style: italic;
}

/* ========================================
   BOTTOM NAVIGATION
   ======================================== */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: var(--bottom-nav-h);
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 100;
  box-shadow: 0 -2px 8px rgba(15, 23, 42, 0.06);
}
.nav-btn {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--text-muted);
  position: relative;
  transition: color 0.15s;
}
.nav-btn:active { background: var(--bg); }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn span {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.nav-btn.has-filter::after {
  content: '';
  position: absolute;
  top: 8px; left: calc(50% + 8px);
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--av);
  border: 2px solid white;
}
.nav-btn.active {
  color: var(--teal);
}

/* ========================================
   BOTTOM SHEET (drawer de filtros)
   ======================================== */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 200;
  backdrop-filter: blur(2px);
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 8px 0 24px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  z-index: 201;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 -10px 30px rgba(15, 23, 42, 0.2);
}
.sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 40px; height: 4px;
  background: var(--border);
  border-radius: 100px;
  margin: 4px auto 18px;
}
.sheet-header {
  padding: 0 20px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.sheet-title {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--navy);
  letter-spacing: -0.5px;
}
.sheet-close {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
}
.sheet-close:active { background: var(--border); }
.sheet-close svg { width: 16px; height: 16px; }

.sheet-section {
  padding: 0 20px;
  margin-bottom: 22px;
}
.sheet-section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.opt-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.opt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  background: var(--bg);
  border: 1.5px solid transparent;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  width: 100%;
  text-align: left;
  transition: all 0.15s;
}
.opt:active { background: var(--border); }
.opt.active {
  background: white;
  border-color: var(--navy);
  color: var(--navy);
  box-shadow: 0 4px 12px rgba(31, 58, 95, 0.12);
}
.opt.active.m-jul { border-color: #D97706; color: #D97706; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.15); }
.opt.active.m-ago { border-color: #DC2626; color: #DC2626; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.15); }
.opt.active.m-set { border-color: #16A34A; color: #16A34A; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15); }

.opt-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 0;
}
.opt-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.opt-dot.todos { background: var(--text-muted); }
.opt-dot.jul { background: #D97706; }
.opt-dot.ago { background: #DC2626; }
.opt-dot.set { background: #16A34A; }
.opt-name { flex: 1; min-width: 0; }
.opt-count {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  background: white;
  padding: 3px 9px;
  border-radius: 100px;
  flex-shrink: 0;
}
.opt.active .opt-count { background: rgba(31, 58, 95, 0.1); color: inherit; font-weight: 700; }
.opt-check {
  color: var(--teal);
  opacity: 0;
  transition: opacity 0.15s;
}
.opt.active .opt-check { opacity: 1; }
.opt-check svg { width: 18px; height: 18px; }

/* ========================================
   DESKTOP (≥768px)
   ======================================== */
@media (min-width: 768px) {
  body { padding-bottom: 0; }
  
  .header { padding: 32px 0 28px; padding-top: 32px; }
  .header > div { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
  .header-top { gap: 16px; }
  .brand-mark { width: 52px; height: 52px; font-size: 28px; border-radius: 12px; }
  .brand-text { font-size: 12px; letter-spacing: 3px; }
  .brand-name { font-size: 24px; }
  .header-period { font-size: 13px; }
  .header-period strong { font-size: 16px; }
  .header-title { font-size: 44px; margin-top: 18px; }
  
  .stats-row { padding: 18px 0; }
  .stats-row-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px;
    gap: 14px;
  }
  .stat-pill { min-width: 0; flex: 1; padding: 16px 20px; }
  .stat-pill .v { font-size: 34px; }
  
  .active-filters { max-width: 1180px; margin: 0 auto; padding: 16px 24px 0; }
  
  .main { max-width: 1180px; margin: 0 auto; padding: 22px 24px 60px; }
  
  .course-title { font-size: 48px; letter-spacing: -2px; }
  
  /* Overview em grid no desktop */
  .overview-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }
  .overview-card { padding: 22px; }
  .overview-card-num { font-size: 28px; width: 50px; }
  .overview-card-name { font-size: 22px; }
  
  /* Disciplinas lado a lado no desktop */
  .disc-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  .disc-card { box-shadow: var(--shadow-md); }
  .disc-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); transition: all 0.3s ease; }
  .disc-header { padding: 22px 26px; gap: 18px; }
  .disc-num { width: 48px; height: 48px; font-size: 26px; }
  .disc-name { font-size: 22px; }
  .modality-list { padding: 18px; gap: 12px; }
  .modality { padding: 16px 18px; }
  .mod-icon-wrap { width: 46px; height: 46px; }
  .mod-main { font-size: 18px; }
  
  /* Legenda horizontal no desktop */
  .legend {
    padding: 18px 22px;
  }
  .legend-items {
    flex-direction: row;
    gap: 28px;
    flex-wrap: wrap;
  }
  .legend-item span { display: inline; }
  
  /* Bottom nav vira FAB no desktop */
  .bottom-nav {
    position: fixed;
    bottom: 24px;
    right: 24px;
    left: auto;
    width: auto;
    height: auto;
    padding: 0;
    background: transparent;
    backdrop-filter: none;
    border: none;
    box-shadow: none;
    flex-direction: column;
    gap: 10px;
  }
  .nav-btn {
    flex: 0;
    width: 52px; height: 52px;
    background: var(--navy);
    color: white;
    border-radius: 50%;
    box-shadow: var(--shadow-lg);
    transition: all 0.2s ease;
  }
  .nav-btn:hover {
    background: var(--teal);
    transform: scale(1.08);
  }
  .nav-btn span { display: none; }
  .nav-btn.active { background: var(--teal); color: white; }
  .nav-btn.has-filter::after {
    top: 4px; right: 4px; left: auto;
  }
}

@media (min-width: 1024px) {
  .disc-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ========================================
   ANIMATIONS
   ======================================== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.97); }
  to { opacity: 1; transform: scale(1); }
}
.animate-fade { animation: fadeIn 0.35s ease forwards; }
.overview-card, .disc-card { animation: fadeUp 0.4s ease forwards; opacity: 0; }
.disc-card:nth-child(1) { animation-delay: 0.05s; }
.disc-card:nth-child(2) { animation-delay: 0.12s; }
.overview-card:nth-child(1) { animation-delay: 0.03s; }
.overview-card:nth-child(2) { animation-delay: 0.06s; }
.overview-card:nth-child(3) { animation-delay: 0.09s; }
.overview-card:nth-child(4) { animation-delay: 0.12s; }
.overview-card:nth-child(5) { animation-delay: 0.15s; }
.overview-card:nth-child(6) { animation-delay: 0.18s; }
.overview-card:nth-child(7) { animation-delay: 0.21s; }
.event-pill { animation: fadeIn 0.25s ease forwards; }

/* ========================================
   PRINT
   ======================================== */
@media print {
  body { background: white; padding-bottom: 0; }
  .bottom-nav, .sheet, .sheet-backdrop, .active-filters { display: none !important; }
  .header { background: var(--navy) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .disc-card { break-inside: avoid; box-shadow: none; }
  .modality { break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .disc-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* Hover só em dispositivos com mouse */
@media (hover: hover) {
  .overview-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--teal); }
  .event-pill:hover { border-color: var(--mod-color); color: var(--mod-dark); transform: translateY(-1px); }
  .opt:hover { background: var(--border); }
}
</style>

}
function filterByMonth(events, mf) {
  return mf === 'todos' ? events : events.filter(e => e.month_num === mf);
}
function fmtDate(e)     { return String(e.day).padStart(2,'0') + '/' + MONTH_SHORT[e.month_num]; }
function fmtDateLong(e) { return e.day + ' de ' + MONTH_FULL[e.month_num]; }
function summarizeSchedule(events) {
  if (!events.length) return null;
  const wds = [...new Set(events.map(e => e.weekday))];
  return {
    isUniform: wds.length === 1,
    weekday: wds[0],
    count: events.length,
    plural: WEEKDAY_PLURAL[wds[0]],
    cap: WEEKDAY_CAP[wds[0]],
  };
}

function gcalUrl(event, course, discName, type) {
  const dateStr = event.iso.replace(/-/g, '');
  const start = dateStr + 'T190000';
  const end   = dateStr + 'T210000';
  const modTitle = { S: 'Aula online', L: 'Laboratório/Presencial', AV: 'AVALIAÇÃO' }[event.mark];
  const text = encodeURIComponent('[' + modTitle + '] ' + (discName || 'Disciplina') + ' — ' + course);
  const details = encodeURIComponent(
    'Curso: ' + course + '\n' +
    'Disciplina: ' + (discName || 'A confirmar título') + '\n' +
    'Modalidade: ' + modTitle + '\n' +
    'Dia: ' + WEEKDAY_CAP[event.weekday] + ', ' + fmtDateLong(event) + '\n\n' +
    'Cronograma 2026/2 · Centro Universitário LS — UniLS'
  );
  const location = encodeURIComponent(event.mark === 'S'
    ? 'AVA / Google Meet (a confirmar pelo professor)'
    : 'Centro Universitário LS — Campus');
  return 'https://www.google.com/calendar/render?action=TEMPLATE&text=' + text +
    '&dates=' + start + '/' + end + '&details=' + details + '&location=' + location;
}

// ============== STATS ROW ==============
function renderStats() {
  const allEvents = state.course === -1
    ? COURSES.flatMap(c => c.disciplines.flatMap(d => d.events))
    : COURSES[state.course].disciplines.flatMap(d => d.events);
  const filtered = filterByMonth(allEvents, state.month);
  const cls = classifyEvents(filtered);
  
  const stats = state.course === -1 ? [
    { v: COURSES.length, l: 'Cursos', accent: 'var(--navy)' },
    { v: cls.sync.length, l: 'Aulas online', accent: 'var(--sync)' },
    { v: cls.lab.length, l: 'Presencial', accent: 'var(--lab)' },
    { v: cls.av.length, l: 'Avaliações', accent: 'var(--av)' },
  ] : [
    { v: filtered.length, l: 'Total no período', accent: 'var(--navy)' },
    { v: cls.sync.length, l: 'Aulas online', accent: 'var(--sync)' },
    { v: cls.lab.length, l: 'Presencial', accent: 'var(--lab)' },
    { v: cls.av.length, l: 'Avaliações', accent: 'var(--av)' },
  ];
  
  document.getElementById('stats').innerHTML = stats.map(s => `
    <div class="stat-pill" style="--accent: ${s.accent};">
      <div class="v">${s.v}</div>
      <div class="l">${s.l}</div>
    </div>
  `).join('');
}

// ============== ACTIVE FILTERS BADGES ==============
function renderActiveFilters() {
  const badges = [];
  
  if (state.course !== -1) {
    const c = COURSES[state.course];
    badges.push(`
      <div class="filter-badge course">
        <span class="badge-dot"></span>
        <span class="badge-label">Curso</span>
        <span>${c.name}</span>
        <button class="badge-x" onclick="goOverview()" aria-label="Remover filtro de curso">${ICON_X}</button>
      </div>
    `);
  }
  if (state.month !== 'todos') {
    const m = MONTHS.find(x => x.num === state.month);
    const cls = m.num === 7 ? 'month-jul' : m.num === 8 ? 'month-ago' : 'month-set';
    badges.push(`
      <div class="filter-badge ${cls}">
        <span class="badge-dot"></span>
        <span class="badge-label">Mês</span>
        <span>${m.name}</span>
        <button class="badge-x" onclick="setState({month: 'todos'})" aria-label="Remover filtro de mês">${ICON_X}</button>
      </div>
    `);
  }
  
  document.getElementById('active-filters').innerHTML = badges.join('');
}

// ============== OVERVIEW ==============
function renderOverview() {
  const monthLabel = state.month === 'todos' ? 'todo o período' : MONTH_FULL[state.month];
  
  let html = `
    <div class="course-title-row">
      <div class="course-eyebrow">Visão geral</div>
      <h2 class="course-title">7 cursos · semipresencial</h2>
      <div class="course-title-sub">Mostrando encontros de <strong>${monthLabel}</strong> · toque em um curso para ver o detalhamento</div>
    </div>
  `;
  
  html += renderLegend();
  
  html += '<div class="overview-list">';
  COURSES.forEach((c, i) => {
    const allEvents = c.disciplines.flatMap(d => d.events);
    const filtered = filterByMonth(allEvents, state.month);
    const cls = classifyEvents(filtered);
    
    html += `
      <button class="overview-card" data-course="${i}">
        <div class="overview-card-num">${String(i + 1).padStart(2, '0')}</div>
        <div class="overview-card-body">
          <div class="overview-card-name">${c.name}</div>
          <div class="overview-card-stats">
            <span class="s-sync">${cls.sync.length} online</span>
            <span class="s-lab">${cls.lab.length} presencial</span>
            <span class="s-av">${cls.av.length} avaliação</span>
          </div>
        </div>
        <div class="overview-card-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
      </button>
    `;
  });
  html += '</div>';
  
  document.getElementById('content').innerHTML = html;
  document.querySelectorAll('.overview-card').forEach(card => {
    card.addEventListener('click', () => {
      const i = parseInt(card.dataset.course, 10);
      setState({ course: i });
    });
  });
}

function renderLegend() {
  return `
    <div class="legend">
      <div class="legend-title">Como ler este cronograma</div>
      <div class="legend-items">
        <div class="legend-item"><div class="legend-dot s">S</div><div><strong>Síncrona/Remota</strong> <span>aula online ao vivo</span></div></div>
        <div class="legend-item"><div class="legend-dot l">L</div><div><strong>Laboratório/Presencial</strong> <span>encontro no campus</span></div></div>
        <div class="legend-item"><div class="legend-dot av">AV</div><div><strong>Avaliação</strong> <span>dia da prova</span></div></div>
      </div>
    </div>
  `;
}

// ============== COURSE DETAIL ==============
function renderCourseDetail() {
  const course = COURSES[state.course];
  const monthLabel = state.month === 'todos' ? 'todo o período' : MONTH_FULL[state.month];
  
  let html = `
    <div class="course-title-row">
      <div class="course-eyebrow">Curso ${String(state.course + 1).padStart(2,'0')} de ${COURSES.length}</div>
      <h2 class="course-title">${course.name}</h2>
      <div class="course-title-sub">Mostrando <strong>${monthLabel}</strong> · toque em qualquer data para adicionar ao Google Calendar</div>
    </div>
  `;
  
  html += renderLegend();
  
  html += '<div class="disc-grid">';
  course.disciplines.forEach((disc, di) => {
    const palette = DISC_PALETTE[di] || DISC_PALETTE[0];
    const filtered = filterByMonth(disc.events, state.month);
    const cls = classifyEvents(filtered);
    const discIsPending = !disc.name;
    const discName = disc.name || '<em>A confirmar título</em>';
    
    html += `
      <div class="disc-card" style="--disc-color: ${palette.color}; --disc-color-dark: ${palette.dark};">
        <div class="disc-header">
          <div class="disc-num">${di + 1}</div>
          <div class="disc-meta">
            <div class="disc-eyebrow">Disciplina ${di + 1}</div>
            <div class="disc-name">${discName}</div>
          </div>
        </div>
        <div class="modality-list">
          ${renderModality('sync', cls.sync, course.name, disc.name)}
          ${renderModality('lab',  cls.lab,  course.name, disc.name)}
          ${renderModality('av',   cls.av,   course.name, disc.name)}
        </div>
      </div>
    `;
  });
  html += '</div>';
  
  document.getElementById('content').innerHTML = html;
  document.querySelectorAll('.event-pill').forEach((p, i) => {
    p.style.animationDelay = (i * 0.02) + 's';
  });
}

function renderModality(type, events, courseName, discName) {
  const config = {
    sync: { cls: 'mod-sync', icon: ICON_SYNC, label: 'Síncrona/Remota · aula online' },
    lab:  { cls: 'mod-lab',  icon: ICON_LAB,  label: 'Laboratório/Presencial · campus' },
    av:   { cls: 'mod-av',   icon: ICON_AV,   label: 'Avaliação · dia da prova' },
  };
  const c = config[type];
  
  if (!events.length) {
    const msg = state.month === 'todos' ? 'Sem encontros previstos' : 'Sem encontros neste mês';
    return `
      <div class="modality ${c.cls}">
        <div class="mod-icon-wrap">${c.icon}</div>
        <div class="mod-body">
          <div class="mod-label">${c.label}</div>
          <div class="no-events">${msg}</div>
        </div>
      </div>
    `;
  }
  
  let mainText, subText = '';
  if (type === 'sync') {
    const s = summarizeSchedule(events);
    if (s && s.isUniform) {
      mainText = state.month === 'todos' ? `Toda ${s.cap.toUpperCase()}-FEIRA` : `Todas as ${s.plural}`;
      subText = `${s.count} encontro${s.count > 1 ? 's' : ''} · ${fmtDate(events[0])} → ${fmtDate(events[events.length - 1])}`;
    } else {
      mainText = `${events.length} encontros`;
    }
  } else if (type === 'lab') {
    const s = summarizeSchedule(events);
    if (s && s.isUniform) {
      mainText = events.length === 1
        ? `${WEEKDAY_CAP[events[0].weekday]}, ${fmtDateLong(events[0])}`
        : `${events.length} ${s.plural}`;
    } else {
      mainText = `${events.length} encontros`;
    }
  } else {
    const e = events[0];
    mainText = `${WEEKDAY_CAP[e.weekday]}, ${fmtDateLong(e)}`;
    subText = events.length > 1 ? `${events.length} avaliações` : 'Prova oficial da disciplina';
  }
  
  let pillsHtml = '<div class="event-pills">';
  events.forEach(e => {
    const url = gcalUrl(e, courseName, discName, type);
    pillsHtml += `
      <a class="event-pill" href="${url}" target="_blank" rel="noopener" title="Adicionar ao Google Calendar">
        <span>${fmtDate(e)}</span>
        <span class="pill-wd">· ${WEEKDAY_CAP[e.weekday]}</span>
        ${ICON_CAL}
      </a>
    `;
  });
  pillsHtml += '</div>';
  
  return `
    <div class="modality ${c.cls}">
      <div class="mod-icon-wrap">${c.icon}</div>
      <div class="mod-body">
        <div class="mod-label">${c.label}</div>
        <div class="mod-main">${mainText}</div>
        ${subText ? `<div class="mod-sub">${subText}</div>` : ''}
        ${pillsHtml}
      </div>
    </div>
  `;
}

// ============== BOTTOM SHEET ==============
function openSheet(type) {
  activeSheet = type;
  const sheet = document.getElementById('sheet');
  const backdrop = document.getElementById('sheet-backdrop');
  const title = document.getElementById('sheet-title');
  const opts = document.getElementById('sheet-options');
  
  let html = '';
  if (type === 'course') {
    title.textContent = 'Filtrar por curso';
    // Opção "Todos os cursos"
    const totalEvents = filterByMonth(COURSES.flatMap(c => c.disciplines.flatMap(d => d.events)), state.month).length;
    html += `
      <button class="opt ${state.course === -1 ? 'active' : ''}" data-course="-1">
        <div class="opt-left">
          <div class="opt-dot todos"></div>
          <div class="opt-name">Todos os cursos (visão geral)</div>
        </div>
        <div class="opt-count">${totalEvents}</div>
        <div class="opt-check">${ICON_CHECK}</div>
      </button>
    `;
    COURSES.forEach((c, i) => {
      const count = filterByMonth(c.disciplines.flatMap(d => d.events), state.month).length;
      html += `
        <button class="opt ${state.course === i ? 'active' : ''}" data-course="${i}">
          <div class="opt-left">
            <div class="opt-dot todos" style="background: var(--teal);"></div>
            <div class="opt-name">${c.name}</div>
          </div>
          <div class="opt-count">${count}</div>
          <div class="opt-check">${ICON_CHECK}</div>
        </button>
      `;
    });
  } else if (type === 'month') {
    title.textContent = 'Filtrar por mês';
    MONTHS.forEach(m => {
      const monthClass = m.num === 7 ? 'm-jul' : m.num === 8 ? 'm-ago' : m.num === 9 ? 'm-set' : '';
      const events = state.course === -1
        ? COURSES.flatMap(c => c.disciplines.flatMap(d => d.events))
        : COURSES[state.course].disciplines.flatMap(d => d.events);
      const count = filterByMonth(events, m.num).length;
      html += `
        <button class="opt ${state.month === m.num ? 'active ' + monthClass : ''}" data-month="${m.num}">
          <div class="opt-left">
            <div class="opt-dot ${m.dotClass}"></div>
            <div class="opt-name">${m.name}</div>
          </div>
          <div class="opt-count">${count}</div>
          <div class="opt-check">${ICON_CHECK}</div>
        </button>
      `;
    });
  }
  opts.innerHTML = html;
  
  // Bind clicks
  opts.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if (type === 'course') {
        const i = parseInt(btn.dataset.course, 10);
        setState({ course: i });
      } else {
        const v = btn.dataset.month;
        setState({ month: v === 'todos' ? 'todos' : parseInt(v, 10) });
      }
      closeSheet();
    });
  });
  
  backdrop.classList.add('open');
  sheet.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheet-backdrop').classList.remove('open');
  document.body.style.overflow = '';
  activeSheet = null;
}

function goOverview() {
  setState({ course: -1 });
}

// ============== STATE / RENDER ==============
function updateNavState() {
  document.getElementById('btn-overview').classList.toggle('active', state.course === -1);
  document.getElementById('btn-filter-course').classList.toggle('has-filter', state.course !== -1);
  document.getElementById('btn-filter-month').classList.toggle('has-filter', state.month !== 'todos');
}

function render() {
  renderStats();
  renderActiveFilters();
  if (state.course === -1) {
    renderOverview();
  } else {
    renderCourseDetail();
  }
  updateNavState();
}

function setState(updates) {
  state = { ...state, ...updates };
  const content = document.getElementById('content');
  content.style.opacity = '0';
  content.style.transform = 'translateY(8px)';
  content.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
  setTimeout(() => {
    render();
    content.style.opacity = '1';
    content.style.transform = 'translateY(0)';
    // Scroll para o topo após troca de curso
    if ('course' in updates) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }, 180);
}

// Fechar sheet com ESC
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && activeSheet) closeSheet();
});

// Init
render();
</script>
